name: 'Create a Rich Check 06202026'
description: "Rich checks from GitHub Mastery Book"
inputs:
  name:
    description: 'The name of the check'
    required: true
  status:
    description: 'the status of the check `queued`, `in_progress` or `completed`'
    required: true
  title:
    description: 'the title to put on the check panel'
    required: true
  summary:
    description: 'The summary of the check runs current result'
    required: true
  details:
    description: 'The details for the check'
    required: false

outputs:
  check_run_id:
    description: 'contains the check run id of the check created '
    value: ${{ steps.check.outputs.result }}

runs:
  using: "composite"
  steps:
  - name: step to create check completed
    uses: actions/github-script@v8
    id: check
    env:
      INPUT_NAME: ${{ inputs.name }}
      INPUT_STATUS: ${{ inputs.status }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SUMMARY: ${{ inputs.summary }}
      INPUT_DETAILS: ${{ inputs.details }}
    with:
      result-encoding: string
      # ADD THIS LINE: Explicitly passes authentication to the nested script
      github-token: ${{ github.token }} 
      script: |
        const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
        
        let body = {
          owner: owner,
          repo: repo,
          name: process.env.INPUT_NAME || repo,
          head_sha: process.env.GITHUB_SHA,
          status: process.env.INPUT_STATUS,
          conclusion: process.env.INPUT_STATUS === 'completed' ? 'success' : undefined, 
          output: {
            title: process.env.INPUT_TITLE,
            summary: process.env.INPUT_SUMMARY,
            text: process.env.INPUT_DETAILS || ''
          }
        };

        const check = await github.rest.checks.create(body);
        return String(check.data.id);
